name: ecommerce-customer-analytics CI

on:
  push:
    branches: [main]
    paths: ["ecommerce-customer-analytics/**", ".github/workflows/ecommerce-customer-analytics.yml"]
  pull_request:
    paths: ["ecommerce-customer-analytics/**", ".github/workflows/ecommerce-customer-analytics.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecommerce-customer-analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ecommerce-customer-analytics/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test
        run: pytest -q
